<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de Descuento</title>
</head>
<body>

    <h1>Calculadora de Descuento</h1>

    <form>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" required>
        <br><br>

        <label for="descuento">Porcentaje de descuento:</label>
        <input type="number" id="descuento" required>
        <br><br>

        <button type="button" onclick="calcular()">Calcular</button>
    </form>

    <p id="resultado"></p>

    <script>

        function calcular() {

            let precio = Number(document.getElementById("precio").value);
            let descuento = Number(document.getElementById("descuento").value);

            let precioFinal = precio - (precio * descuento / 100);

            document.getElementById("resultado").innerText =
                "Precio final: $" + precioFinal;
        }

    </script>

    <!--
    Declaración de uso de IA:

    Se utilizó la sugerencia de emplear getElementById(), Number()
    e innerText para capturar los datos ingresados por el usuario,
    realizar el cálculo y mostrar el resultado en la página.

    Se descartaron alternativas más complejas, como el uso de librerías
    externas o validaciones avanzadas, porque no eran necesarias para
    cumplir con los requisitos de la consigna.
    -->

</body>
</html>
